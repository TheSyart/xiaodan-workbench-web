# Reference only. ServerOps writes the production copy after replacing the
# application id and certificate paths with validated server-side values.
map $http_cookie $workbench_cookie_without_serverops {
    "~^(?:__Host-serverops_app_access=[^;]*(?:;\s*)?(.*)|(.*?);\s*__Host-serverops_app_access=[^;]*(;\s*.*)?)$" $1$2$3;
    default $http_cookie;
}

server {
    listen 80;
    listen [::]:80;
    server_name workbench.shanchen.space;

    location ^~ /.well-known/acme-challenge/ {
        auth_request off;
        root /var/lib/serverops/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name workbench.shanchen.space;

    ssl_certificate /etc/letsencrypt/live/workbench.shanchen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.shanchen.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:XIAODAN_WORKBENCH_SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_request /_serverops/access/verify;
    auth_request_set $serverops_authorization_request_id $upstream_http_x_serverops_authorization_request_id;
    error_page 401 = @serverops_access_login;

    location = /_serverops/access/verify {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:3084/api/v1/access/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1:3084;
        proxy_set_header X-ServerOps-Internal-Protocol "nginx-auth-v1";
        proxy_set_header X-ServerOps-Application-Id __SERVEROPS_APPLICATION_ID__;
        proxy_set_header X-ServerOps-Original-Host $host;
        proxy_set_header X-ServerOps-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location = /_serverops/access/callback {
        auth_request off;
        proxy_pass http://127.0.0.1:3084/api/v1/access/callback;
        proxy_set_header Host $host;
        proxy_set_header X-ServerOps-Internal-Protocol "nginx-callback-v1";
        proxy_set_header X-ServerOps-Application-Id __SERVEROPS_APPLICATION_ID__;
        proxy_set_header X-ServerOps-Original-Host $host;
        proxy_set_header X-ServerOps-Original-URI "/_serverops/access/callback";
        proxy_set_header Cookie "";
    }

    location @serverops_access_login {
        auth_request off;
        if ($serverops_authorization_request_id !~ "^[A-Za-z0-9_-]{43}$") { return 503; }
        return 302 https://ops.shanchen.space/access/authorize?request_id=$serverops_authorization_request_id;
    }

    location ^~ /.well-known/acme-challenge/ {
        auth_request off;
        root /var/lib/serverops/acme;
    }

    client_max_body_size 24m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Cookie $workbench_cookie_without_serverops;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
